<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Maska Sub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <span class="dot"></span>
      Maska Sub
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Forgot your<br><span>password?</span></h1>
      <p>Enter the email address on your account and we'll send you a reset link.</p>
    </section>

    <section class="plans" style="display:block;max-width:420px;margin:0 auto;">
      <label>Email address</label>
      <input type="email" id="emailInput" placeholder="you@email.com" required
        style="width:100%;padding:12px;margin-bottom:16px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;">

      <button class="pay-btn" id="submitBtn" style="width:100%;">Send reset link</button>

      <p style="text-align:center;margin-top:16px;">
        <a href="/login.html" style="color:inherit;text-decoration:underline;">Back to log in</a>
      </p>

      <div id="messageBox" style="margin-top:16px;"></div>
    </section>

  </main>

  <footer class="footer">
    <p>Maska Sub — built for fast, local data resale.</p>
  </footer>

  <script>
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("messageBox");

    submitBtn.addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      messageBox.textContent = "";

      if (!email || !email.includes("@")) {
        messageBox.innerHTML = `<p style="color:#f66;">Please enter a valid email address.</p>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        // Always show a generic success-style message, matching what the server
        // returns — this is intentional so no one can use this page to check
        // whether a given phone number has an account.
        messageBox.innerHTML = `<p>${data.message || data.error || "If that email has an account, a reset link has been sent."}</p>`;
      } catch (err) {
        messageBox.innerHTML = `<p style="color:#f66;">Something went wrong. Please try again.</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
