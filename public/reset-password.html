<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Maska Sub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <span class="dot"></span>
      Maska Sub
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Set a new<br><span>password.</span></h1>
      <p>Choose a new password for your account.</p>
    </section>

    <section class="plans" style="display:block;max-width:420px;margin:0 auto;">
      <label>New password</label>
      <input type="password" id="passwordInput" placeholder="At least 6 characters" required
        style="width:100%;padding:12px;margin-bottom:16px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;">

      <label>Confirm new password</label>
      <input type="password" id="confirmInput" placeholder="Repeat password" required
        style="width:100%;padding:12px;margin-bottom:16px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;">

      <button class="pay-btn" id="submitBtn" style="width:100%;">Reset password</button>

      <div id="messageBox" style="margin-top:16px;"></div>
    </section>

  </main>

  <footer class="footer">
    <p>Maska Sub — built for fast, local data resale.</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const phone = params.get("phone");

    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("messageBox");

    if (!token || !phone) {
      messageBox.innerHTML = `<p style="color:#f66;">This reset link is missing information. Please request a new one from the <a href="/forgot-password.html" style="color:inherit;">forgot password page</a>.</p>`;
      submitBtn.disabled = true;
    }

    submitBtn.addEventListener("click", async () => {
      const password = document.getElementById("passwordInput").value;
      const confirm = document.getElementById("confirmInput").value;
      messageBox.textContent = "";

      if (password.length < 6) {
        messageBox.innerHTML = `<p style="color:#f66;">Password must be at least 6 characters.</p>`;
        return;
      }
      if (password !== confirm) {
        messageBox.innerHTML = `<p style="color:#f66;">Passwords do not match.</p>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Resetting…";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, token, newPassword: password }),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.innerHTML = `<p style="color:#f66;">${data.error}</p>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Reset password";
          return;
        }

        messageBox.innerHTML = `<p>${data.message} <a href="/login.html" style="color:inherit;text-decoration:underline;">Log in now →</a></p>`;
        submitBtn.style.display = "none";
      } catch (err) {
        messageBox.innerHTML = `<p style="color:#f66;">Something went wrong. Please try again.</p>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
